# infrastructure/deployment/kubernetes/AI-service-scaling.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: labforge-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-tesla-t4  # GPU node
      containers:
      - name: ai
        image: labforge/ai-service:latest
        ports:
        - containerPort: 5000
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "8Gi"
            cpu: "4"
          requests:
            memory: "4Gi"
            cpu: "2"
        env:
        - name: MODEL_CACHE_SIZE
          value: "2"
        - name: MAX_CONCURRENT_INFERENCE
          value: "10"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 60
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: labforge-ai
spec:
  selector:
    app: ai-service
  ports:
  - port: 5000
  type: ClusterIP