# infrastructure/deployment/kubernetes/autoscaling-runtime.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: labforge-autoscaler
  namespace: labforge-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: workspace-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: AverageValue
        averageValue: 1500Mi
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2
        periodSeconds: 30
---
# Custom autoscaler for AI service based on queue length
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: labforge-ai-autoscaler
  namespace: labforge-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Pods
    pods:
      metric:
        name: ai_queue_length
      target:
        type: AverageValue
        averageValue: "10"
---
# Custom autoscaler for simulation workers based on tick lag
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: labforge-simulation-autoscaler
  namespace: labforge-simulation
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simulation-worker
  minReplicas: 1
  maxReplicas: 20
  metrics:
  - type: Object
    object:
      metric:
        name: simulation_tick_lag_ms
      describedObject:
        apiVersion: v1
        kind: Service
        name: simulation-coordinator
      target:
        type: Value
        value: "50"